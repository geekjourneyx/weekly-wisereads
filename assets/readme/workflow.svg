<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title>Weekly Wisereads workflow</title>
  <desc>Editorial workflow from issue discovery to publication with explicit evidence and review checkpoints.</desc>
  <rect width="900" height="560" fill="#080808" />
  <text x="72" y="76" fill="#C9A86A" font-size="36" font-family="Georgia, 'Times New Roman', serif" letter-spacing="4">
    WORKFLOW
  </text>
  <text x="72" y="118" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    Discovery, reading, judgment
  </text>
  <text x="72" y="156" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    and publishing stay
  </text>
  <text x="72" y="194" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    explicit and reviewable.
  </text>

  <rect x="72" y="236" width="156" height="132" fill="none" stroke="#F2EFE8" stroke-width="4" />
  <rect x="272" y="236" width="156" height="132" fill="none" stroke="#F2EFE8" stroke-width="4" />
  <rect x="472" y="236" width="156" height="132" fill="none" stroke="#F2EFE8" stroke-width="4" />
  <rect x="672" y="236" width="156" height="132" fill="none" stroke="#C9A86A" stroke-width="4" />

  <text x="98" y="282" fill="#F2EFE8" font-size="36" font-family="Georgia, 'Times New Roman', serif">1</text>
  <text x="150" y="326" text-anchor="middle" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">Discover</text>

  <text x="298" y="282" fill="#F2EFE8" font-size="36" font-family="Georgia, 'Times New Roman', serif">2</text>
  <text x="350" y="326" text-anchor="middle" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">Read</text>

  <text x="498" y="282" fill="#F2EFE8" font-size="36" font-family="Georgia, 'Times New Roman', serif">3</text>
  <text x="550" y="326" text-anchor="middle" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">Judge</text>

  <text x="698" y="282" fill="#C9A86A" font-size="36" font-family="Georgia, 'Times New Roman', serif">4</text>
  <text x="750" y="326" text-anchor="middle" fill="#C9A86A" font-size="34" font-family="Georgia, 'Times New Roman', serif">Publish</text>

  <path d="M244 302 L272 302" fill="none" stroke="#9B968E" stroke-width="4" />
  <path d="M240 286 L272 302 L240 318" fill="none" stroke="#9B968E" stroke-width="4" />
  <path d="M428 302 L472 302" fill="none" stroke="#9B968E" stroke-width="4" />
  <path d="M440 286 L472 302 L440 318" fill="none" stroke="#9B968E" stroke-width="4" />
  <path d="M628 302 L672 302" fill="none" stroke="#C9A86A" stroke-width="4" />
  <path d="M640 286 L672 302 L640 318" fill="none" stroke="#C9A86A" stroke-width="4" />

  <text x="72" y="430" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    Start from the live issue page.
  </text>
  <text x="72" y="468" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    Keep access status separate
  </text>
  <text x="72" y="504" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    from editorial conviction.
  </text>
</svg>
