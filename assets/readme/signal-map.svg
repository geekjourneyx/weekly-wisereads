<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title>Weekly Wisereads signal map</title>
  <desc>Signal map separating HIGHLIGHT-RANKED DOCUMENTS from a distinct CURATED EBOOK route before editorial review.</desc>
  <rect width="900" height="620" fill="#080808" />
  <text x="72" y="76" fill="#C9A86A" font-size="36" font-family="Georgia, 'Times New Roman', serif" letter-spacing="4">
    SIGNAL MAP
  </text>
  <text x="72" y="118" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    Ranked documents and curated
  </text>
  <text x="72" y="156" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    ebook selection enter
  </text>
  <text x="72" y="194" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    through different paths.
  </text>

  <g id="highlight-ranked-route">
    <rect x="72" y="228" width="300" height="256" fill="none" stroke="#F2EFE8" stroke-width="4" />
    <text x="96" y="272" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      HIGHLIGHT
    </text>
    <text x="96" y="310" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      RANKED
    </text>
    <text x="96" y="348" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      DOCUMENTS
    </text>
    <text x="96" y="392" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      articles
    </text>
    <text x="96" y="430" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      videos
    </text>
    <text x="96" y="468" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      tweets / PDFs
    </text>
    <path d="M372 350 L470 350" fill="none" stroke="#F2EFE8" stroke-width="4" />
    <path d="M438 334 L470 350 L438 366" fill="none" stroke="#F2EFE8" stroke-width="4" />
  </g>

  <g id="curated-ebook-route">
    <rect x="72" y="520" width="300" height="56" fill="none" stroke="#C9A86A" stroke-width="4" />
    <text x="96" y="558" fill="#C9A86A" font-size="34" font-family="Georgia, 'Times New Roman', serif">
      CURATED EBOOK
    </text>
    <path d="M386 548 L470 548" fill="none" stroke="#C9A86A" stroke-width="4" />
    <path d="M438 532 L470 548 L438 564" fill="none" stroke="#C9A86A" stroke-width="4" />
  </g>

  <rect x="470" y="260" width="338" height="220" fill="none" stroke="#F2EFE8" stroke-width="4" />
  <text x="496" y="308" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    EDITORIAL
  </text>
  <text x="496" y="346" fill="#F2EFE8" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    REVIEW
  </text>
  <text x="496" y="386" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    popularity
  </text>
  <text x="496" y="422" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    facts / access
  </text>
  <text x="496" y="458" fill="#9B968E" font-size="34" font-family="Georgia, 'Times New Roman', serif">
    judgment
  </text>
</svg>
